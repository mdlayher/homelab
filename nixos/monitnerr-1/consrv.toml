# Configuration for monitnerr-1.
[[devices]]
name = "router"
serial = "Q3245527461"
baud = 115200
identities = ["mdlayher"]

[[devices]]
name = "server"
serial = "A64NMAJS"
baud = 115200
identities = ["mdlayher"]

# The four ports of the FTDI quad cable share one USB serial number, so each
# is selected by its USB interface number. TODO: rename quad0-quad3 once each
# port's target machine is identified.
[[devices]]
name = "quad0"
serial = "FT9DX98X"
interface = 0
baud = 115200
identities = ["mdlayher"]

[[devices]]
name = "quad1"
serial = "FT9DX98X"
interface = 1
baud = 115200
identities = ["mdlayher"]

[[devices]]
name = "quad2"
serial = "FT9DX98X"
interface = 2
baud = 115200
identities = ["mdlayher"]

[[devices]]
name = "quad3"
serial = "FT9DX98X"
interface = 3
baud = 115200
identities = ["mdlayher"]

[[identities]]
name = "mdlayher"
public_key = "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIN5i5d0mRKAf02m+ju+I1KrAYw3Ny2IHXy88mgyragBN Matt Layher (mdlayher@gmail.com)"

