# sops configuration: which age recipients may decrypt each secrets file.
#
# - mdlayher: admin key in ~/.config/sops/age/keys.txt on the workstation, used
#   to edit secrets
# - machine keys: derived from each machine's /etc/ssh/ssh_host_ed25519_key.pub
#   via ssh-to-age, used by sops-nix to decrypt secrets at activation time
# - linuxdev-gate: the development container's secrets gate, generated in
#   place by its sops-gate-keygen unit (see nixos/servnerr-4/dev.nix); lets
#   the admin edit secrets from the container behind a YubiKey touch
# - linuxdev-agent: the development container user's own key in
#   ~/.config/sops/age/keys.txt, with no gate; reads the inventory, so
#   agents can check addresses and MACs, and the deploy scripts' secrets
#   (lib/, windows/), so a deploy runs without the gate. Editing the
#   inventory still goes through the gate.
keys:
  - &mdlayher age136z4kwkfsqlvaa7e6f5c79rzjstg4ktq2lw6zadv23c038jnafssp2mngs
  - &linuxdev-gate age1szssulmqnc0n650xcqvn7rpu2zjwnhrta4tvcm7tpxtmg26lsqysna0fks
  - &linuxdev-agent age1v6mhrhylaretpey25vyax8032vg060yrg5mrs3rz5gvstzqs2pcqsaqhzj
  - &servnerr-4 age1dt4928w6c2py0rzcnwntdr6dcf62mf8wkhe3hm8mnscqxcewrdkqz6jh3d
  - &routnerr-3 age1vgxvcs9q6zr4l8udgxgnzj02rzcqy4dt9x2gz9u2k97dnhj88pvqlhlvk8
  - &edge-pdx age1323pt5w9df0ealmd0xy954ajy5gtrhvdlh4nf3d4pjqvnvvqfq3qjf5lpa
  - &edge-iad age1rf9xq9wuqcvtr9u7g4vd80ck0us2nfqc3f8uey0gafsvqxf73grqcjtkfk
creation_rules:
  - path_regex: nixos/servnerr-4/secrets\.yaml$
    key_groups:
      - age:
          - *mdlayher
          - *linuxdev-gate
          - *servnerr-4
  - path_regex: nixos/routnerr-3/secrets\.yaml$
    key_groups:
      - age:
          - *mdlayher
          - *linuxdev-gate
          - *routnerr-3
  - path_regex: nixos/secrets/common\.yaml$
    key_groups:
      - age:
          - *mdlayher
          - *linuxdev-gate
          - *routnerr-3
          - *servnerr-4
          - *edge-pdx
          - *edge-iad
  - path_regex: nixos/inventory/secrets\.yaml$
    key_groups:
      - age:
          - *mdlayher
          - *linuxdev-gate
          - *linuxdev-agent
          - *routnerr-3
          - *servnerr-4
          - *edge-pdx
          - *edge-iad
  - path_regex: nixos/edge-pdx/secrets\.yaml$
    key_groups:
      - age:
          - *mdlayher
          - *linuxdev-gate
          - *edge-pdx
  - path_regex: nixos/edge-iad/secrets\.yaml$
    key_groups:
      - age:
          - *mdlayher
          - *linuxdev-gate
          - *edge-iad
  # Glasshouse's token on the LG TVs, set in its dashboard; the server's
  # Prometheus scrapes with it.
  - path_regex: lgtv/secrets\.yaml$
    key_groups:
      - age:
          - *mdlayher
          - *linuxdev-gate
          - *servnerr-4
  # The deploy scripts' secrets: lib/ for every deploy script, windows/ for
  # windows/deploy. No machine decrypts these.
  - path_regex: (lib|windows)/secrets\.yaml$
    key_groups:
      - age:
          - *mdlayher
          - *linuxdev-gate
          - *linuxdev-agent
  # Credentials the admin uses from the development container through the
  # secrets gate (API tokens for tofu and gh); no machine decrypts these.
  - path_regex: ^secrets/[^/]+\.yaml$
    key_groups:
      - age:
          - *mdlayher
          - *linuxdev-gate
