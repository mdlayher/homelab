# sops configuration: which age recipients may decrypt each secrets file.
#
# - matt: admin key in ~/.config/sops/age/keys.txt on nerr-4, used to edit secrets
# - servnerr-4: derived from /etc/ssh/ssh_host_ed25519_key.pub via ssh-to-age,
#   used by sops-nix to decrypt secrets at activation time
keys:
  - &matt age136z4kwkfsqlvaa7e6f5c79rzjstg4ktq2lw6zadv23c038jnafssp2mngs
  - &servnerr-4 age1dt4928w6c2py0rzcnwntdr6dcf62mf8wkhe3hm8mnscqxcewrdkqz6jh3d
creation_rules:
  - path_regex: nixos/servnerr-4/secrets\.yaml$
    key_groups:
      - age:
          - *matt
          - *servnerr-4
