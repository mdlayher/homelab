name: update-flake-lock

on:
  workflow_dispatch:
  schedule:
    # Weekly on Sunday at 10:00 UTC.
    - cron: "0 10 * * 0"

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      # Opens a PR bumping flake.lock. Merging it is what rolls new nixpkgs
      # out to machines via system.autoUpgrade.
      - uses: DeterminateSystems/update-flake-lock@v24
        with:
          pr-title: "flake.lock: update"
          pr-labels: dependencies
