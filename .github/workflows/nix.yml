name: nix

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: DeterminateSystems/magic-nix-cache-action@v9
      # Evaluates every nixosConfiguration and the other flake outputs.
      - run: nix flake check
      - run: nix fmt -- --ci
