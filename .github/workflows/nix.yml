name: nix

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: DeterminateSystems/magic-nix-cache-action@v9
      # Ubuntu 23.10 and later restrict unprivileged user namespaces through
      # AppArmor, and the router firewall check creates them inside the
      # build sandbox for its network namespaces.
      # Skipped on a runner image without the setting.
      - run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      # Evaluates every nixosConfiguration and the other flake outputs, and
      # runs the checks.
      - run: nix flake check
      - run: nix fmt -- --ci

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        host: [routnerr-3, servnerr-4]
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: DeterminateSystems/magic-nix-cache-action@v9
      # Builds the full system closure, which runs build-time checks such as
      # nft --check, promtool, and amtool that evaluation alone does not.
      - run: nix build --no-link .#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel
